[project]
name = "slean"
version = "0.2.0"
description = "Verifiable worlds, a kernel-checked library and a discovery loop for autonomous research"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
slean = "slean.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["slean*"]
