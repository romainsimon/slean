name: Site final image

on:
  pull_request:
  push:
    branches:
      - main
      - codex/slean-coolify-runtime

concurrency:
  group: site-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build exact candidate image
        run: |
          test -z "$(git status --porcelain)"
          candidate_sha="$(git rev-parse HEAD)"
          docker build --build-arg SOURCE_COMMIT="$candidate_sha" -t slean-site:candidate .
      - name: Install browser test runtime
        run: |
          (cd site && npm ci && npx playwright install --with-deps chromium)
      - name: Smoke final image and browser through Nginx
        run: bash tools/smoke_site_image.sh slean-site:candidate "$(git rev-parse HEAD)"
      - name: Audit browser test dependency
        run: npm audit --prefix site --audit-level=high
